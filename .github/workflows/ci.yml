name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run pytest
        run: |
          pytest -v --tb=short 2>&1 | tee test_output.log || (cat test_output.log >> $GITHUB_STEP_SUMMARY && exit 1)
